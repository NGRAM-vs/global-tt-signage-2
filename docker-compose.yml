services:
  postgres:
    image: postgres:16
    container_name: signal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - signal-postgres-data:/var/lib/postgresql/data

volumes:
  signal-postgres-data:
