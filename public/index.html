<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global T &amp; T Digital Signage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  body { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 20% 20%, var(--accent-soft) 0%, transparent 45%), var(--bg); }
  .card { text-align: center; max-width: 420px; padding: 20px; }
  .card .brand-mark.hero { margin-bottom: 20px; }
  p { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
  .links { display: flex; gap: 12px; justify-content: center; }
  a.btn { text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark hero">
      <img class="brand-badge" src="assets/badge.png" alt="">
      <span class="brand-text">
        <span class="brand-name">Global T &amp; T</span>
        <span class="brand-tag">Digital Signage</span>
      </span>
    </div>
    <p>Upload content and control what plays on your screens from the dashboard. Open the pairing link on each screen once to connect it.</p>
    <div class="links">
      <a href="admin.html" class="btn btn-primary">Open dashboard</a>
      <a href="player.html" class="btn btn-ghost">Open player</a>
    </div>
  </div>
</body>
</html>
